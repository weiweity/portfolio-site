<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="100%" role="img">
  <title>芙清 CRM ETL 数据流图</title>
  <desc>从原始 Excel 到 DuckDB 到前端展示的完整数据流向，包含 ETL 6 道门禁</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, system-ui, sans-serif; }
    .t { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
    .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
    .tc { font-size: 11px; font-weight: 400; fill: #888780; }
    .tb { font-size: 13px; font-weight: 400; fill: #2C2C2A; }
    .box { fill: #fff; stroke: #B4B2A9; stroke-width: 0.5; }
    .step-num { font-size: 13px; font-weight: 500; fill: #fff; }
    .circle { fill: #185FA5; }
    .arr { fill: none; stroke: #5F5E5A; stroke-width: 1; marker-end: url(#arrow); }
  </style>

  <text x="340" y="28" text-anchor="middle" class="t">芙清 CRM — 完整 ETL 数据流</text>

  <circle cx="80" cy="60" r="16" class="circle"/>
  <text x="80" y="65" text-anchor="middle" class="step-num">1</text>
  <text x="80" y="92" text-anchor="middle" class="ts">数据源</text>
  <rect x="120" y="45" width="150" height="30" rx="6" class="box"/>
  <text x="195" y="64" text-anchor="middle" class="tb">店铺订单 + 会员数据</text>

  <line x1="270" y1="60" x2="310" y2="62" class="arr"/>

  <circle cx="330" cy="62" r="16" class="circle"/>
  <text x="330" y="67" text-anchor="middle" class="step-num">2</text>
  <text x="330" y="94" text-anchor="middle" class="ts">加载</text>
  <rect x="370" y="47" width="160" height="30" rx="6" class="box"/>
  <text x="450" y="66" text-anchor="middle" class="tb">load_data_files()</text>

  <line x1="530" y1="62" x2="570" y2="62" class="arr"/>

  <circle cx="590" cy="62" r="16" class="circle"/>
  <text x="590" y="67" text-anchor="middle" class="step-num">3</text>
  <text x="590" y="94" text-anchor="middle" class="ts">清洗</text>
  <text x="620" y="70" class="tc">中文→snake</text>

  <line x1="620" y1="110" x2="590" y2="140" class="arr"/>

  <circle cx="570" cy="155" r="16" class="circle"/>
  <text x="570" y="160" text-anchor="middle" class="step-num">4</text>
  <text x="570" y="187" text-anchor="middle" class="ts">转换</text>
  <rect x="430" y="140" width="110" height="30" rx="6" class="box"/>
  <text x="485" y="159" text-anchor="middle" class="tb">渠道 8 层漏斗</text>
  <rect x="380" y="140" width="40" height="30" rx="6" class="box"/>
  <text x="400" y="159" text-anchor="middle" class="ts">SPU</text>

  <line x1="380" y1="155" x2="330" y2="155" class="arr"/>

  <circle cx="310" cy="155" r="16" class="circle"/>
  <text x="310" y="160" text-anchor="middle" class="step-num">5</text>
  <text x="310" y="187" text-anchor="middle" class="ts">写入</text>
  <rect x="180" y="140" width="100" height="30" rx="6" class="box"/>
  <text x="230" y="159" text-anchor="middle" class="tb">upsert 去重</text>

  <line x1="180" y1="155" x2="130" y2="155" class="arr"/>

  <circle cx="110" cy="155" r="16" class="circle"/>
  <text x="110" y="160" text-anchor="middle" class="step-num">6</text>
  <text x="110" y="187" text-anchor="middle" class="ts">断言</text>
  <rect x="40" y="140" width="60" height="30" rx="6" class="box"/>
  <text x="70" y="159" text-anchor="middle" class="ts">6 Gate</text>

  <line x1="70" y1="170" x2="70" y2="215" class="arr"/>

  <rect x="25" y="215" width="220" height="65" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="135" y="238" text-anchor="middle" class="t">6 道数据质量门禁</text>
  <text x="55" y="258" class="tc">1. 日期合理性</text>
  <text x="160" y="258" class="tc">2. 跨日连续性</text>
  <text x="55" y="273" class="tc">3. 业务平滑性</text>
  <text x="160" y="273" class="tc">4. 去重验证</text>

  <line x1="135" y1="280" x2="135" y2="310" class="arr"/>

  <rect x="60" y="310" width="150" height="45" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="135" y="330" text-anchor="middle" class="t">DuckDB 55GB</text>
  <text x="135" y="347" text-anchor="middle" class="tc">单例 · 线程安全 · KV Cache</text>

  <line x1="210" y1="332" x2="280" y2="332" class="arr"/>

  <rect x="290" y="310" width="150" height="45" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="365" y="330" text-anchor="middle" class="t">FastAPI 后端</text>
  <text x="365" y="347" text-anchor="middle" class="tc">语义层 → 服务层 → 路由层</text>

  <line x1="440" y1="332" x2="510" y2="310" class="arr"/>
  <line x1="440" y1="332" x2="510" y2="355" class="arr"/>

  <rect x="520" y="295" width="140" height="30" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="590" y="315" text-anchor="middle" class="ts">Vue 3 前端看板</text>
  <rect x="520" y="340" width="140" height="30" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="590" y="360" text-anchor="middle" class="ts">飞书 9:00 推送</text>

  <rect x="25" y="410" width="630" height="100" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5" rx="10"/>
  <text x="340" y="435" text-anchor="middle" class="t">launchd 定时调度（macOS）</text>
  <rect x="60" y="448" width="130" height="28" rx="6" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="125" y="466" text-anchor="middle" class="ts">ETL 每日 08:30</text>
  <rect x="210" y="448" width="140" height="28" rx="6" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="280" y="466" text-anchor="middle" class="ts">DuckDB 备份 03:30</text>
  <rect x="370" y="448" width="130" height="28" rx="6" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="435" y="466" text-anchor="middle" class="ts">备份清理 每周日</text>
  <rect x="520" y="448" width="120" height="28" rx="6" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="580" y="466" text-anchor="middle" class="ts">/tmp 清理 每小时</text>
  <text x="340" y="498" text-anchor="middle" class="tc">Docker / NSSM Windows Service 双平台部署</text>
</svg>