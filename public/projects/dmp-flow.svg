<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="100%" role="img">
  <title>达摩盘 DMP 数据采集流程图</title>
  <desc>一次完整数据采集流程：准备→登录→抓取→校验→写入→同步，含失败恢复</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, system-ui, sans-serif; }
    .t { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
    .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
    .tc { font-size: 11px; font-weight: 400; fill: #888780; }
    .box { fill: #fff; stroke: #B4B2A9; stroke-width: 0.5; }
    .box-teal { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
    .box-coral { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
    .box-amber { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; }
    .arr { fill: none; stroke: #5F5E5A; stroke-width: 1; marker-end: url(#arrow); }
    .arr-err { fill: none; stroke: #993C1D; stroke-width: 1; marker-end: url(#arrow-coral); }
    .step-num { font-size: 12px; font-weight: 500; fill: #fff; }
    .circle { fill: #0F6E56; }
    .circle-err { fill: #993C1D; }
  </style>

  <text x="340" y="25" text-anchor="middle" class="t">单品洞察采集 — 完整执行流程</text>

  <circle cx="80" cy="55" r="16" class="circle"/>
  <text x="80" y="60" text-anchor="middle" class="step-num">1</text>
  <text x="80" y="87" text-anchor="middle" class="ts">环境检查</text>
  <rect x="120" y="42" width="200" height="26" rx="6" class="box"/>
  <text x="220" y="59" text-anchor="middle" class="ts">chrome_profile · account.txt · CSV扫描</text>

  <line x1="320" y1="55" x2="360" y2="55" class="arr"/>

  <circle cx="380" cy="55" r="16" class="circle"/>
  <text x="380" y="60" text-anchor="middle" class="step-num">2</text>
  <text x="380" y="87" text-anchor="middle" class="ts">登录</text>
  <rect x="420" y="42" width="230" height="26" rx="6" class="box"/>
  <text x="535" y="59" text-anchor="middle" class="ts">launch_persistent_context · 千牛登录</text>

  <line x1="535" y1="68" x2="535" y2="100" class="arr"/>

  <circle cx="535" cy="115" r="16" class="circle"/>
  <text x="535" y="120" text-anchor="middle" class="step-num">3</text>
  <text x="535" y="147" text-anchor="middle" class="ts">缺失检测</text>
  <rect x="420" y="102" width="230" height="26" rx="6" class="box"/>
  <text x="535" y="119" text-anchor="middle" class="ts">get_missing_dates · 断点续传检查</text>

  <line x1="535" y1="128" x2="535" y2="155" class="arr"/>

  <circle cx="535" cy="170" r="16" class="circle"/>
  <text x="535" y="175" text-anchor="middle" class="step-num">4</text>
  <text x="535" y="202" text-anchor="middle" class="ts">反检测</text>
  <rect x="420" y="157" width="230" height="26" rx="6" class="box"/>
  <text x="535" y="174" text-anchor="middle" class="ts">10层 · nw.webdriver=false · 插件填充</text>

  <line x1="535" y1="183" x2="535" y2="210" class="arr"/>

  <circle cx="535" cy="225" r="16" class="circle"/>
  <text x="535" y="230" text-anchor="middle" class="step-num">5</text>
  <text x="535" y="257" text-anchor="middle" class="ts">导航</text>
  <rect x="420" y="212" width="230" height="26" rx="6" class="box"/>
  <text x="535" y="229" text-anchor="middle" class="ts">page.goto(DMP_URL + spm + endDate)</text>

  <line x1="535" y1="238" x2="535" y2="270" class="arr"/>

  <circle cx="535" cy="290" r="16" class="circle"/>
  <text x="535" y="295" text-anchor="middle" class="step-num">6</text>
  <text x="535" y="322" text-anchor="middle" class="ts">四阶段抓取</text>

  <rect x="100" y="335" width="130" height="55" rx="8" class="box-teal"/>
  <text x="165" y="355" text-anchor="middle" class="ts">Phase 1</text>
  <text x="165" y="372" text-anchor="middle" class="tc">早期数据 12s</text>
  <text x="165" y="385" text-anchor="middle" class="tc">历史合理性校验</text>

  <text x="245" y="368" class="tc">→</text>

  <rect x="260" y="335" width="130" height="55" rx="8" class="box-teal"/>
  <text x="325" y="355" text-anchor="middle" class="ts">Phase 2</text>
  <text x="325" y="372" text-anchor="middle" class="tc">稳定轮询 24s</text>
  <text x="325" y="385" text-anchor="middle" class="tc">3轮稳定确认</text>

  <text x="405" y="368" class="tc">→</text>

  <rect x="420" y="335" width="130" height="55" rx="8" class="box-teal"/>
  <text x="485" y="355" text-anchor="middle" class="ts">Phase 3</text>
  <text x="485" y="372" text-anchor="middle" class="tc">取 max(early, final)</text>
  <text x="485" y="385" text-anchor="middle" class="tc">健全性检查</text>

  <line x1="485" y1="390" x2="485" y2="430" class="arr"/>

  <circle cx="485" cy="445" r="16" class="circle"/>
  <text x="485" y="450" text-anchor="middle" class="step-num">7</text>
  <text x="485" y="477" text-anchor="middle" class="ts">Date Sanity</text>
  <rect x="380" y="432" width="210" height="26" rx="6" class="box-amber"/>
  <text x="485" y="449" text-anchor="middle" class="ts">SPA显示日期 = 目标日期？</text>

  <line x1="485" y1="458" x2="485" y2="488" class="arr"/>

  <rect x="385" y="488" width="200" height="22" rx="6" class="box"/>
  <text x="485" y="503" text-anchor="middle" class="ts">append-only → CSV · mark_completed</text>

  <line x1="300" y1="368" x2="60" y2="510" class="arr-err"/>
  <circle cx="50" cy="510" r="12" class="circle-err"/>
  <text x="50" y="514" text-anchor="middle" class="step-num">!</text>
  <text x="50" y="534" text-anchor="middle" class="tc">失败→60s重试</text>

  <line x1="650" y1="368" x2="650" y2="450" class="arr-err"/>
  <text x="620" y="430" class="tc">崩溃检测</text>
  <rect x="610" y="450" width="80" height="22" rx="5" class="box-coral"/>
  <text x="650" y="465" text-anchor="middle" class="tc">重建+重登</text>
</svg>