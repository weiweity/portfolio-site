<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1520"/>
      <stop offset="100%" stop-color="#2d1f3d"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D86A3A"/>
      <stop offset="100%" stop-color="#E0A03A"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)" rx="8"/>
  <!-- Header -->
  <rect x="40" y="30" width="560" height="28" rx="6" fill="rgba(255,255,255,0.06)"/>
  <circle cx="58" cy="44" r="5" fill="#ef4444" opacity="0.7"/>
  <circle cx="76" cy="44" r="5" fill="#eab308" opacity="0.7"/>
  <circle cx="94" cy="44" r="5" fill="#22c55e" opacity="0.7"/>
  <text x="320" y="49" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="11">Playwright + Chromium · T+1 Automation</text>
  <!-- Browser mockup -->
  <rect x="60" y="80" width="520" height="200" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Browser top bar -->
  <rect x="60" y="80" width="520" height="24" rx="6" fill="rgba(255,255,255,0.06)"/>
  <rect x="60" y="98" width="520" height="6" fill="rgba(255,255,255,0.06)"/>
  <text x="320" y="96" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="9">dmp.taobao.com — 达摩盘</text>
  <!-- Data flow diagram inside browser -->
  <!-- Module 1: Assets -->
  <rect x="85" y="120" width="140" height="60" rx="5" fill="rgba(216,106,58,0.12)" stroke="rgba(216,106,58,0.4)" stroke-width="1"/>
  <text x="155" y="145" text-anchor="middle" fill="#D86A3A" font-family="monospace" font-size="10" font-weight="bold">资产诊断</text>
  <text x="155" y="163" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-family="monospace" font-size="8">DOM 提取 → data2.csv</text>
  <!-- Module 2: Flow -->
  <rect x="250" y="120" width="140" height="60" rx="5" fill="rgba(224,160,58,0.12)" stroke="rgba(224,160,58,0.4)" stroke-width="1"/>
  <text x="320" y="145" text-anchor="middle" fill="#E0A03A" font-family="monospace" font-size="10" font-weight="bold">流转数据</text>
  <text x="320" y="163" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-family="monospace" font-size="8">API 拦截 → data.csv</text>
  <!-- Module 3: Items -->
  <rect x="415" y="120" width="140" height="60" rx="5" fill="rgba(45,134,89,0.12)" stroke="rgba(45,134,89,0.4)" stroke-width="1"/>
  <text x="485" y="145" text-anchor="middle" fill="#2D8659" font-family="monospace" font-size="10" font-weight="bold">单品洞察</text>
  <text x="485" y="163" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-family="monospace" font-size="8">双轨 → data3.csv</text>
  <!-- Gate badges -->
  <rect x="100" y="192" width="50" height="18" rx="9" fill="rgba(216,106,58,0.2)"/>
  <text x="125" y="204" text-anchor="middle" fill="#D86A3A" font-family="monospace" font-size="8">3 门禁</text>
  <rect x="265" y="192" width="50" height="18" rx="9" fill="rgba(224,160,58,0.2)"/>
  <text x="290" y="204" text-anchor="middle" fill="#E0A03A" font-family="monospace" font-size="8">3 门禁</text>
  <rect x="430" y="192" width="50" height="18" rx="9" fill="rgba(45,134,89,0.2)"/>
  <text x="455" y="204" text-anchor="middle" fill="#2D8659" font-family="monospace" font-size="8">6 门禁</text>
  <!-- Anti-detect badge -->
  <rect x="200" y="224" width="220" height="22" rx="11" fill="rgba(177,74,32,0.15)" stroke="rgba(177,74,32,0.4)" stroke-width="1"/>
  <text x="310" y="239" text-anchor="middle" fill="#B14A20" font-family="monospace" font-size="9" font-weight="bold">10 层反检测 · navigator.webdriver=false</text>
  <!-- Bottom stats -->
  <rect x="60" y="295" width="165" height="50" rx="6" fill="rgba(255,255,255,0.04)"/>
  <text x="142" y="318" text-anchor="middle" fill="#D86A3A" font-family="sans-serif" font-size="20" font-weight="bold">7040</text>
  <text x="142" y="336" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="9">行 × 9 列</text>
  <rect x="240" y="295" width="165" height="50" rx="6" fill="rgba(255,255,255,0.04)"/>
  <text x="322" y="318" text-anchor="middle" fill="#E0A03A" font-family="sans-serif" font-size="20" font-weight="bold">15 SKU</text>
  <text x="322" y="336" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="9">含 1 新品</text>
  <rect x="420" y="295" width="165" height="50" rx="6" fill="rgba(255,255,255,0.04)"/>
  <text x="502" y="318" text-anchor="middle" fill="#2D8659" font-family="sans-serif" font-size="20" font-weight="bold">T+1</text>
  <text x="502" y="336" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="9">每日 0 干预</text>
</svg>
