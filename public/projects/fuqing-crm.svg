  <!-- Main chart area -->
  <rect x="185" y="70" width="415" height="140" rx="6" fill="rgba(255,255,255,0.04)"/>
  <!-- Bar chart -->
  <rect x="210" y="160" width="30" height="35" rx="3" fill="rgba(216,106,58,0.6)"/>
  <rect x="250" y="135" width="30" height="60" rx="3" fill="rgba(216,106,58,0.7)"/>
  <rect x="290" y="110" width="30" height="85" rx="3" fill="rgba(216,106,58,0.8)"/>
  <rect x="330" y="90" width="30" height="105" rx="3" fill="url(#bar)"/>
  <rect x="370" y="100" width="30" height="95" rx="3" fill="rgba(216,106,58,0.8)"/>
  <rect x="410" y="120" width="30" height="75" rx="3" fill="rgba(216,106,58,0.7)"/>
  <rect x="450" y="140" width="30" height="55" rx="3" fill="rgba(216,106,58,0.6)"/>
  <rect x="490" y="150" width="30" height="45" rx="3" fill="rgba(216,106,58,0.5)"/>
  <!-- Stat cards bottom -->
  <rect x="185" y="225" width="125" height="95" rx="6" fill="rgba(255,255,255,0.04)"/>
  <text x="247" y="258" text-anchor="middle" fill="#D86A3A" font-family="sans-serif" font-size="20" font-weight="bold">1030万</text>
  <text x="247" y="278" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="9">订单数据</text>
  <rect x="325" y="225" width="125" height="95" rx="6" fill="rgba(255,255,255,0.04)"/>
  <text x="387" y="258" text-anchor="middle" fill="#E0A03A" font-family="sans-serif" font-size="20" font-weight="bold">10x</text>
  <text x="387" y="278" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="9">ETL 提速</text>
  <rect x="465" y="225" width="135" height="95" rx="6" fill="rgba(255,255,255,0.04)"/>
  <text x="532" y="258" text-anchor="middle" fill="#2D8659" font-family="sans-serif" font-size="20" font-weight="bold">391+</text>
  <text x="532" y="278" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="9">测试用例</text>
