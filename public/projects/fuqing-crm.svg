  <rect x="520" y="8" width="110" height="18" rx="9" fill="rgba(216,106,58,0.15)"/>
  <text x="575" y="20" text-anchor="middle" fill="#D86A3A" font-family="monospace" font-size="8" font-weight="bold">FastAPI + DuckDB</text>
