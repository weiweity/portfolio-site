<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1520"/>
      <stop offset="100%" stop-color="#2d1f3d"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D86A3A"/>
      <stop offset="100%" stop-color="#E0A03A"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)" rx="8"/>
  <!-- Header -->
  <rect x="40" y="30" width="560" height="28" rx="6" fill="rgba(255,255,255,0.06)"/>
  <circle cx="58" cy="44" r="5" fill="#ef4444" opacity="0.7"/>
  <circle cx="76" cy="44" r="5" fill="#eab308" opacity="0.7"/>
  <circle cx="94" cy="44" r="5" fill="#22c55e" opacity="0.7"/>
  <text x="320" y="49" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="11">RAG Pipeline · 4-Route RRF Fusion</text>
  <!-- Pipeline flow diagram -->
  <!-- 4 recall channels -->
  <rect x="40" y="80" width="130" height="36" rx="6" fill="rgba(216,106,58,0.15)" stroke="#D86A3A" stroke-width="1"/>
  <text x="105" y="102" text-anchor="middle" fill="#D86A3A" font-family="monospace" font-size="9" font-weight="bold">FAISS 语义向量</text>
  <rect x="40" y="124" width="130" height="36" rx="6" fill="rgba(216,106,58,0.12)" stroke="rgba(216,106,58,0.5)" stroke-width="1"/>
  <text x="105" y="146" text-anchor="middle" fill="rgba(216,106,58,0.7)" font-family="monospace" font-size="9">BM25 关键词</text>
  <rect x="40" y="168" width="130" height="36" rx="6" fill="rgba(216,106,58,0.12)" stroke="rgba(216,106,58,0.5)" stroke-width="1"/>
  <text x="105" y="190" text-anchor="middle" fill="rgba(216,106,58,0.7)" font-family="monospace" font-size="9">search_questions</text>
  <rect x="40" y="212" width="130" height="36" rx="6" fill="rgba(216,106,58,0.10)" stroke="rgba(216,106,58,0.4)" stroke-width="1"/>
  <text x="105" y="234" text-anchor="middle" fill="rgba(216,106,58,0.6)" font-family="monospace" font-size="9">TF-IDF 稀疏</text>
  <!-- Arrows to RRF fusion -->
  <line x1="170" y1="98" x2="220" y2="168" stroke="rgba(216,106,58,0.4)" stroke-width="1.5"/>
  <line x1="170" y1="142" x2="220" y2="172" stroke="rgba(216,106,58,0.3)" stroke-width="1.5"/>
  <line x1="170" y1="186" x2="220" y2="176" stroke="rgba(216,106,58,0.3)" stroke-width="1.5"/>
  <line x1="170" y1="230" x2="220" y2="180" stroke="rgba(216,106,58,0.2)" stroke-width="1.5"/>
  <!-- RRF fusion box -->
  <rect x="220" y="150" width="100" height="48" rx="8" fill="url(#pipe)" opacity="0.9"/>
  <text x="270" y="172" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11" font-weight="bold">RRF</text>
  <text x="270" y="188" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="8">k=60</text>
  <!-- Arrow to scorer -->
  <line x1="320" y1="174" x2="360" y2="174" stroke="rgba(216,106,58,0.5)" stroke-width="1.5"/>
  <polygon points="358,170 366,174 358,178" fill="rgba(216,106,58,0.5)"/>
  <!-- Scorer -->
  <rect x="360" y="150" width="100" height="48" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="410" y="172" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="monospace" font-size="9">8 维打分</text>
  <text x="410" y="188" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="8">+ ReRank</text>
  <!-- Arrow to result -->
  <line x1="460" y1="174" x2="500" y2="174" stroke="rgba(216,106,58,0.5)" stroke-width="1.5"/>
  <polygon points="498,170 506,174 498,178" fill="rgba(216,106,58,0.5)"/>
  <!-- Result -->
  <rect x="500" y="150" width="110" height="48" rx="6" fill="rgba(45,134,89,0.15)" stroke="rgba(45,134,89,0.4)" stroke-width="1"/>
  <text x="555" y="172" text-anchor="middle" fill="#2D8659" font-family="sans-serif" font-size="11" font-weight="bold">3s 响应</text>
  <text x="555" y="188" text-anchor="middle" fill="rgba(45,134,89,0.6)" font-family="monospace" font-size="8">召回 90%+</text>
  <!-- Bottom stats -->
  <rect x="40" y="275" width="170" height="65" rx="6" fill="rgba(255,255,255,0.04)"/>
  <text x="125" y="303" text-anchor="middle" fill="#D86A3A" font-family="sans-serif" font-size="22" font-weight="bold">521</text>
  <text x="125" y="323" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="9">条话术 · 7 大分类</text>
  <rect x="230" y="275" width="170" height="65" rx="6" fill="rgba(255,255,255,0.04)"/>
  <text x="315" y="303" text-anchor="middle" fill="#E0A03A" font-family="sans-serif" font-size="22" font-weight="bold">4 路</text>
  <text x="315" y="323" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="9">RRF 融合检索</text>
  <rect x="420" y="275" width="190" height="65" rx="6" fill="rgba(255,255,255,0.04)"/>
  <text x="515" y="303" text-anchor="middle" fill="#2D8659" font-family="sans-serif" font-size="22" font-weight="bold">0 云依赖</text>
  <text x="515" y="323" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="9">全本地部署</text>
  <!-- Corner badge -->
  <rect x="490" y="8" width="140" height="18" rx="9" fill="rgba(216,106,58,0.15)"/>
  <text x="560" y="20" text-anchor="middle" fill="#D86A3A" font-family="monospace" font-size="8" font-weight="bold">FAISS + BM25 + RRF</text>
</svg>
